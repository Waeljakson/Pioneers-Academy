services:
  - type: web
    name: pioneers-academy
    runtime: image
    plan: free
    image:
      url: ghcr.io/waeljakson/pioneers-academy:latest
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
